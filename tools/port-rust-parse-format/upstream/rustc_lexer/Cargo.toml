[package]
name = "rustc_lexer"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
memchr = "=2.8.0"
unicode-ident = "=1.0.24"
unicode-properties = { version = "=0.1.4", default-features = false, features = ["emoji"] }

[dev-dependencies]
expect-test = "=1.5.1"
