[package]
name = "ferrugo-parse-format-oracle"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "ferrugo-parse-format-oracle"
path = "oracle.rs"

[dependencies]
rustc_parse_format = { path = "upstream/rustc_parse_format" }
serde_json = "=1.0.145"
serde_core = "=1.0.228"
