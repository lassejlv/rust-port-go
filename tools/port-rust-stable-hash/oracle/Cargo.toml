[package]
name = "ferrugo-rust-stable-hash-oracle"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
rustc-stable-hash = "=0.1.2"
serde_json = "=1.0.149"

[features]
nightly = ["rustc-stable-hash/nightly"]

[[bin]]
name = "ownership-probe"
path = "ownership_probe.rs"

[workspace]

[[bin]]
name="debug-probe"
path="debug_probe.rs"

[[bin]]
name="oracle"
path="oracle.rs"

[[bin]]
name="trace-oracle"
path="trace_oracle.rs"

[[bin]]
name="arith-oracle"
path="arith_oracle.rs"

[[bin]]
name="format-oracle"
path="format_oracle.rs"
