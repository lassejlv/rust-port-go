[package]
name = "ferrugo-semver-oracle"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "oracle"
path = "oracle.rs"

[features]
default = ["std"]
std = ["semver/std"]
serde = ["semver/serde"]
prefixfree = []

[dependencies]
semver = { version = "=1.0.28", default-features = false }
serde_core = { version = "=1.0.228", default-features = false, features = ["alloc"] }
serde_json = "=1.0.149"

[workspace]

[[bin]]
name = "debug-oracle"
path = "debug_oracle.rs"

[[bin]]
name = "debug-more-oracle"
path = "debug_more_oracle.rs"

[[bin]]
name="debug-dispatch-oracle"
path="debug_dispatch_oracle.rs"

[[bin]]
name="debug-more-dispatch-oracle"
path="debug_more_dispatch_oracle.rs"

[[bin]]
name="debug-state-oracle"
path="debug_state_oracle.rs"

[[bin]]
name="unicode-oracle"
path="unicode_oracle.rs"

[[bin]]
name="debug-newline-oracle"
path="debug_newline_oracle.rs"

[[bin]]
name="collector-oracle"
path="collector_oracle.rs"
