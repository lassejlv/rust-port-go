[package]
name="def_id_reference"
version="0.0.0"
edition="2024"
publish=false
[lib]
path="wrapper/lib.rs"
[dependencies]
rustc_serialize={path="crates/rustc_serialize"}
rustc_hashes={path="crates/rustc_hashes"}
rustc_macros={path="crates/rustc_macros"}
rustc_index_macros={path="crates/rustc_index_macros",features=["nightly"]}
rustc-stable-hash={version="=0.1.2",features=["nightly"]}
rustc-hash="=2.1.1"
indexmap="=2.14.0"
serde_json="=1.0.145"
[workspace]
resolver="3"
members=["crates/rustc_serialize","crates/rustc_hashes","crates/rustc_macros","crates/rustc_index_macros"]
default-members=["."]
