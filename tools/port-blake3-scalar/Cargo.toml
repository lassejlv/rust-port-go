[package]
name = "ferrugo-blake3-scalar-oracle"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
blake3 = { version = "=1.8.2", features = ["pure"] }
# These exact versions come from the pinned Rust Cargo.lock.
arrayref = "=0.3.9"
arrayvec = "=0.7.6"
cfg-if = "=1.0.4"
constant_time_eq = "=0.3.1"
cc = "=1.4.3"
find-msvc-tools = "=0.1.11"
shlex = "=2.0.1"

[[bin]]
name = "oracle"
path = "oracle.rs"

[workspace]
