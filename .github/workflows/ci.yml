name: Ferrugo
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - run: make demo
      - name: Install Rust comparison toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
      - name: Compare conformance fixtures with rustc
        run: go test -count=1 -v ./internal/compiler ./internal/conformance ./internal/cargoconformance
        env:
          FERRUGO_RUSTC: rustc
          FERRUGO_CARGO: cargo
