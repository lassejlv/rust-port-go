name: Ferrugo
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  bootstrap:
    env:
      GORACE: atexit_sleep_ms=0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: go vet ./...
      - run: go test -race -timeout 30m ./...
      - run: make demo
      - name: Install Rust comparison toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
      - name: Compare conformance fixtures with rustc
        run: go test -p 1 -parallel 2 -count=1 -v ./internal/compiler ./internal/conformance ./internal/cargoconformance
        env:
          FERRUGO_RUSTC: rustc
          FERRUGO_CARGO: cargo
          RUSTUP_TOOLCHAIN: 1.99.1
  upstream-ports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Install upstream comparison toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Fetch pinned upstream trees and verify the file map
        run: |
          python3 tools/port-inventory/inventory.py prepare
          python3 tools/port-inventory/inventory.py verify
          python3 -m unittest discover -s tools/port-inventory -p 'test_*.py'
          python3 tools/test_executable_dispatch.py
      - name: Fetch locked source comparison dependencies
        run: |
          cargo fetch --locked --manifest-path tools/port-lexer-oracle/Cargo.toml
          cargo fetch --locked --manifest-path tools/port-lexer-unicode/oracle/Cargo.toml
          cargo fetch --locked --manifest-path tools/port-cargo-graph/Cargo.toml
          cargo fetch --locked --manifest-path tools/port-rust-parse-format/Cargo.toml
          cargo fetch --locked --manifest-path tools/port-literal-escaper/oracle/Cargo.toml
          cargo fetch --locked --manifest-path tools/port-cargo-restricted-names/Cargo.toml
          cargo fetch --locked --manifest-path tools/port-rust-hashes/Cargo.toml
          cargo fetch --locked --manifest-path tools/port-lexer-debug/Cargo.toml
          cargo fetch --locked --manifest-path tools/port-semver/oracle/Cargo.toml
          cargo fetch --locked --manifest-path tools/port-semver/original-tests/Cargo.toml
          cargo fetch --locked --manifest-path tools/port-cargo-semver/Cargo.toml
          cargo fetch --locked --manifest-path tools/port-rust-stable-hash/oracle/Cargo.toml
          cargo fetch --locked --manifest-path tools/port-blake3-scalar/Cargo.toml
          cargo fetch --locked --manifest-path tools/port-unicode-width-scalar/Cargo.toml
        env:
          CARGO_HOME: ${{ github.workspace }}/.toolchain/port-cargo-home
          RUSTUP_TOOLCHAIN: 1.99.1
      - name: Prepare original compiler derives and storage references
        run: |
          python3 tools/port-rust-edition/reference-build/prepare.py --fetch --validate
          python3 tools/port-rust-index-storage/reference-build/prepare.py --fetch --validate
          cargo fetch --locked --manifest-path tools/port-rust-index-storage/oracle/Cargo.toml
          python3 -m unittest discover -s tools/port-rust-index-storage/oracle -p '*_test.py'
          python3 tools/port-rust-fingerprint/reference-build/prepare.py --fetch
          python3 tools/port-rust-def-id/reference-build/prepare.py --fetch
          python3 -m unittest discover -s tools/port-rust-def-id/reference-build -p 'test_*.py'
          python3 tools/port-rust-span-encoding/fetch.py
          go run ./tools/port-rust-interval -fetch-dependency -check
        env:
          FERRUGO_RUSTC: rustc
          FERRUGO_CARGO: cargo
          FERRUGO_GO: go
          CARGO_HOME: ${{ github.workspace }}/.toolchain/port-cargo-home
          RUSTUP_TOOLCHAIN: 1.99.1
      - name: Compare source ports with the originals
        run: go test -count=1 -v ./port/...
        env:
          FERRUGO_LEXER_ORACLE: '1'
          FERRUGO_QUEUE_ORACLE: '1'
          FERRUGO_REGENERATE_UNICODE_ORACLE: '1'
          FERRUGO_REGENERATE_CORE_UNICODE_ORACLE: '1'
          FERRUGO_REGENERATE_LITERAL_ESCAPER_ORACLE: '1'
          FERRUGO_RUSTC: rustc
          FERRUGO_CARGO: cargo
          CARGO_HOME: ${{ github.workspace }}/.toolchain/port-cargo-home
          RUSTUP_TOOLCHAIN: 1.99.1
      - name: Compare Cargo graph with original debug and release builds
        run: |
          go run ./tools/port-cargo-graph -check
          python3 tools/port-cargo-graph/contracts/generate_errno.py --check
          python3 tools/port-cargo-graph/contracts/generate_stdio.py --offline --check
          python3 tools/port-cargo-graph/contracts/generate_owned.py --check
          python3 tools/port-cargo-graph/contracts/generate_equality.py --check
          python3 tools/port-cargo-graph/contracts/audit.py --check
          python3 tools/port-rust-str/prepare.py --fetch
          python3 tools/port-cargo-graph/contracts/audit_sort_sources.py --fetch --check
        env:
          FERRUGO_CARGO: cargo
          FERRUGO_RUSTC: rustc
          FERRUGO_GO: go
          CARGO_HOME: ${{ github.workspace }}/.toolchain/port-cargo-home
          RUSTUP_TOOLCHAIN: 1.99.1
      - name: Verify compiler utility references
        run: |
          go run ./tools/port-rust-base-n -check
          python3 tools/port-rust-base-n/contracts/generate.py --check
          python3 tools/port-rust-base-n/contracts/owned_generate.py --check
          go run ./tools/port-rust-binary-search -check
          python3 tools/port-rust-binary-search/owned/generate.py --check
          go run ./tools/port-rust-union-find -check
          go run ./tools/port-rust-union-find/format -check
          go run ./tools/port-rust-thousands -check
          go test -tags ferrugo_rustc_nightly ./port/rust/compiler/rustc_index/src
          go test -tags ferrugo_rustc_nightly ./port/rust/compiler/rustc_index/src/vec
          go run -tags ferrugo_rustc_nightly ./tools/port-rust-index -check
          go run ./tools/port-rust-parse-format -check
          go run ./tools/port-rust-parse-format/char-unicode -check
          python3 tools/port-rust-parse-format/debug/generate.py -check
          python3 -m unittest discover -s tools/port-rust-parse-format/debug -p 'test_*.py'
          go run ./tools/port-cargo-restricted-names -check
          go run ./tools/port-rust-edition -check
          python3 tools/port-rust-hashes/generate.py --check
          go run ./tools/port-rust-index-storage/oracle -check
          go test -tags ferrugo_rustc_nightly ./port/rust/compiler/rustc_index/src/interval
          go run ./tools/port-rust-interval -check
          go run ./tools/port-rust-interval/compat -check
          python3 tools/port-rust-span-encoding/generate.py -check
          python3 tools/port-rust-span-encoding/ambient-debug/generate.py -check
          python3 -m unittest discover -s tools/port-rust-span-encoding -p 'test_*.py'
          python3 tools/port-rust-fingerprint/generate.py --offline --check
          python3 tools/port-rust-fingerprint/decode-metadata/generate.py --offline --check
          python3 tools/port-rust-indexmap/replace-owned/generate.py --offline --check
          python3 tools/port-rust-fingerprint/hasher-contract/generate.py --offline --check
          python3 tools/port-lexer-debug/generate.py --check
          python3 -m unittest discover -s tools/port-lexer-debug -p 'test_*.py'
          go run ./tools/port-lexer-debug/char -check
          go run ./tools/port-lexer-debug/string -check
          go run ./tools/port-semver -check
          go run ./tools/port-cargo-semver -check
          go run ./tools/port-rust-stable-hash -check
          python3 tools/port-rust-stable-hash/panic-guards/generate.py --offline --check
          python3 tools/port-semver/original-tests/audit.py --check
          python3 tools/port-semver/original-tests/run.py --offline
          python3 tools/port-rust-stable-hash/original-tests/audit.py --check
          python3 tools/port-rust-stable-hash/original-tests/run.py --offline
          python3 tools/port-blake3-scalar/generate.py --check
          python3 tools/port-unicode-width-scalar/generate.py --check
          python3 port/support/rustfmt/testdata/non_exhaustive_generate.py --check
        env:
          FERRUGO_GO: go
          FERRUGO_RUSTC: rustc
          FERRUGO_CARGO: cargo
          CARGO_HOME: ${{ github.workspace }}/.toolchain/port-cargo-home
          RUSTUP_TOOLCHAIN: 1.99.1
      - name: Compare scoped IndexMap operations with the locked original
        run: |
          python3 tools/port-rust-indexmap/generate.py --offline --check
          python3 tools/port-rust-indexmap/builder_generate.py --offline --check
          python3 tools/port-rust-indexmap/owned_generate.py --offline --check
          python3 tools/port-rust-indexmap/iterator_generate.py --offline --check
          python3 tools/port-rust-indexmap/into_generate.py --offline --check
          python3 tools/port-rust-indexmap/projection_generate.py --offline --check
          python3 tools/port-rust-indexmap/drain_generate.py --offline --check
          python3 tools/port-rust-indexmap/position_generate.py --offline --check
          python3 tools/port-rust-indexmap/indexed_generate.py --offline --check
          python3 tools/port-rust-indexmap/entry_format_generate.py --offline --check
        env:
          FERRUGO_GO: go
          FERRUGO_RUSTC: rustc
          FERRUGO_CARGO: cargo
          CARGO_HOME: ${{ github.workspace }}/.toolchain/port-cargo-home
          RUSTUP_TOOLCHAIN: 1.99.1
      - name: Verify dependency feature profiles
        run: |
          go test -race -tags semver_no_std ./port/dependencies/semver/v1_0_28/...
          go test -race -tags semver_serde ./port/dependencies/semver/v1_0_28/...
          go test -race -tags 'semver_no_std semver_serde' ./port/dependencies/semver/v1_0_28/...
          go test -race -tags rustc_stable_hash_nightly ./port/dependencies/rustc-stable-hash/v0_1_2/...
          go vet -tags 'semver_no_std semver_serde rustc_stable_hash_nightly' ./port/dependencies/...
  unix-error-reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Install exact SDK comparison compiler
        run: rustup toolchain install nightly-2026-11-04 --profile minimal
      - name: Verify SDK source and compare native host error formatting
        run: |
          python3 tools/port-rust-str/prepare.py --fetch
          python3 tools/port-rust-errno/generate.py --check --go go --rustc rustc --output native-errno.json
          python3 -m unittest discover -s tools/port-rust-errno -p 'test_*.py'
          go test -race ./port/support/rusterrno
          CGO_ENABLED=0 go test ./port/support/rusterrno
        env:
          FERRUGO_RUSTC: rustc
          RUSTUP_TOOLCHAIN: nightly-2026-11-04
      - uses: actions/upload-artifact@v4
        with:
          name: native-errno-${{ matrix.os }}
          path: native-errno.json
  span-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Install matching dated nightly
        run: |
          rustup toolchain install nightly-2026-11-04 --profile minimal
          rustup toolchain install 1.99.1 --profile minimal
          python3 - <<'PY'
          import os, subprocess
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for variable, toolchain in [('FERRUGO_RUSTC', '1.99.1'), ('FERRUGO_RUSTC_NIGHTLY', 'nightly-2026-11-04')]:
                  binary = subprocess.check_output(['rustup', 'which', '--toolchain', toolchain, 'rustc'], text=True).strip()
                  output.write(variable + '=' + binary + '\n')
          PY
      - name: Prepare exact upstream source cache
        run: python3 tools/port-inventory/inventory.py prepare
      - name: Verify reference input and executable guards
        run: |
          python3 tools/test_executable_dispatch.py
          python3 -m unittest discover -s tools/port-rust-span-reference -p 'test_*.py'
          python3 -m unittest discover -s tools/port-rust-span-lib -p 'test_reference_cold.py'
      - name: Build unchanged span crate and run all original tests
        run: python3 tools/port-rust-span-reference/prepare.py --fetch-source --fetch-deps
        env:
          FERRUGO_RUSTC: rustc
          FERRUGO_RUSTDOC: rustdoc
          FERRUGO_CARGO: cargo
          CARGO_HOME: ${{ github.workspace }}/.toolchain/port-cargo-home
          RUSTUP_TOOLCHAIN: nightly-2026-11-04
      - name: Compare scoped tracing with the complete original dependencies
        run: |
          python3 tools/port-rust-tracing/generate.py --check
          python3 tools/port-rust-tracing/processing/generate.py --check
          producer="$RUNNER_TEMP/ferrugo-tracing-producer"
          python3 tools/port-rust-tracing/processing/generate_borrow.py --output-dir "$producer"
          python3 tools/port-rust-tracing/processing/generate_registry.py --output-dir "$producer"
          FERRUGO_TRACING_PRODUCER_DIR="$producer" go test ./port/support/rusttracing -count=1
          python3 -m unittest discover -s tools/port-rust-tracing/processing -p 'test_*.py'
        env:
          FERRUGO_RUSTC: rustc
          FERRUGO_RUSTDOC: rustdoc
          FERRUGO_CARGO: cargo
          CARGO_HOME: ${{ github.workspace }}/.toolchain/port-cargo-home
          RUSTUP_TOOLCHAIN: nightly-2026-11-04
      - name: Retain exact native tracing producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracing-native-producer
          path: ${{ runner.temp }}/ferrugo-tracing-producer
      - name: Verify hash-table and sorting support against actual SDKs
        run: |
          python3 tools/port-rust-unord/table/check.py
          python3 tools/port-rust-unord/sort/generate.py --check
          python3 tools/port-rust-unord/sort/generate_unstable.py --check
          python3 tools/port-rust-unord/cached/generate.py --check
          python3 tools/port-rust-unord/cached/generate_hooks.py --check
          python3 tools/port-rust-unord/panic/generate.py --check
          python3 tools/port-rust-unord/index-context/generate.py --check
          python3 tools/port-rust-unord/map/generate.py --skip-prepare --check
          python3 tools/port-rust-unord/traits/generate.py --skip-prepare --check
          python3 -m unittest discover -s tools/port-rust-unord/table -p 'test_*.py'
          python3 -m unittest discover -s tools/port-rust-unord/panic -p 'test_*.py'
          python3 -m unittest discover -s tools/port-rust-unord/cached -p 'test_*.py'
          python3 -m unittest discover -s tools/port-rust-unord/index-context -p 'test_*.py'
        env:
          FERRUGO_GO: go
          CARGO_HOME: ${{ github.workspace }}/.toolchain/port-cargo-home
          RUSTUP_TOOLCHAIN: nightly-2026-11-04
      - name: Compare scoped serializers and unordered bags with the original
        run: |
          python3 tools/port-rust-span-lib/generate_memory.py --check
          python3 tools/port-rust-span-lib/generate_file.py --check
          python3 tools/port-rust-span-lib/generate_map.py --check
          python3 tools/port-rust-span-lib/generate_opaque_callbacks.py --check
          python3 tools/port-rust-unord/bag/generate.py --check
          python3 tools/port-rust-unord/bag/generate_context.py --check
          python3 tools/port-rust-unord/codec/generate.py --check
          python3 tools/port-rust-unord/codec/generate_vector.py --check
          python3 tools/port-rust-unord/codec/generate_wrapper.py --check
          python3 -m unittest discover -s tools/port-rust-unord/bag -p 'test_*.py'
          python3 -m unittest discover -s tools/port-rust-unord/codec -p 'test_*.py'
        env:
          FERRUGO_GO: go
          FERRUGO_RUSTC: rustc
          FERRUGO_RUSTDOC: rustdoc
          FERRUGO_CARGO: cargo
          CARGO_HOME: ${{ github.workspace }}/.toolchain/port-cargo-home
          RUSTUP_TOOLCHAIN: nightly-2026-11-04
      - name: Compare complete strict-version-hash module
        run: python3 tools/port-rust-svh/generate.py --check
        env:
          FERRUGO_RUSTC: rustc
          FERRUGO_RUSTDOC: rustdoc
          FERRUGO_CARGO: cargo
          CARGO_HOME: ${{ github.workspace }}/.toolchain/port-cargo-home
          RUSTUP_TOOLCHAIN: nightly-2026-11-04
      - name: Compare explicit panic operations with the original runtime
        run: |
          python3 tools/port-rust-panic-runtime/generate.py --check
          python3 tools/port-rust-panic-runtime/location-cells/generate.py --check
        env:
          FERRUGO_RUSTC: rustc
          RUSTUP_TOOLCHAIN: nightly-2026-11-04
      - name: Compare scoped stderr runtime against both exact SDKs
        run: |
          export FERRUGO_STDIO_RUSTC_199="$FERRUGO_RUSTC" FERRUGO_STDIO_RUSTC_1101="$FERRUGO_RUSTC_NIGHTLY"
          python3 tools/port-rust-stdio/generate.py --rustc-199 "$FERRUGO_RUSTC" --rustc-1101 "$FERRUGO_RUSTC_NIGHTLY" --check
          python3 -m unittest discover -s tools/port-rust-stdio -p 'test_*.py'
      - name: Compare original component cleanup and current runtime scopes
        run: |
          python3 -m unittest discover -s tools/port-rust-panic-runtime/component_guards -p 'test_*.py'
          python3 tools/port-rust-panic-runtime/component_guards/generate.py --fetch-source --fetch-deps --check
        env:
          FERRUGO_RUSTC: rustc
          FERRUGO_CARGO: cargo
          CARGO_HOME: ${{ github.workspace }}/.toolchain/port-cargo-home
          RUSTUP_TOOLCHAIN: nightly-2026-11-04
      - name: Compare exact string slicing and Unicode 18 formatting
        run: |
          python3 tools/port-rust-str/prepare.py --fetch
          python3 tools/port-rust-str/generate.py --check
          python3 tools/port-rust-str/generate_ambient.py --check
          python3 tools/port-rust-unicode18/generate.py --check
          python3 -m unittest discover -s tools/port-rust-str -p 'test_*.py'
        env:
          FERRUGO_RUSTC: rustc
          RUSTUP_TOOLCHAIN: nightly-2026-11-04
  span-components:
    name: Span components (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        component: [lib, identity, source-map]
    env:
      GORACE: atexit_sleep_ms=0
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
      FERRUGO_GO: go
      FERRUGO_RUSTC: rustc
      FERRUGO_RUSTDOC: rustdoc
      FERRUGO_CARGO: cargo
      FERRUGO_RUST_SOURCE: ${{ github.workspace }}/.toolchain/upstream-rust
      CARGO_HOME: ${{ github.workspace }}/.toolchain/port-cargo-home
      RUSTUP_TOOLCHAIN: nightly-2026-11-04
      RUSTC_BOOTSTRAP: '1'
      CFG_RELEASE: 1.101.0
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Install exact component reference compilers
        run: |
          rustup toolchain install nightly-2026-11-04 --profile minimal
          if [ '${{ matrix.component }}' = identity ]; then
            rustup toolchain install 1.99.1 --profile minimal
          fi
      - name: Prepare and verify the complete original crate graph
        run: |
          python3 tools/port-inventory/inventory.py prepare
          python3 tools/port-inventory/inventory.py verify
          python3 tools/port-rust-span-reference/prepare.py --fetch-source --fetch-deps
          python3 -m unittest discover -s tools/port-rust-span-reference -p 'test_*.py'
      - name: Verify Lib and wrapper proof integrity
        if: matrix.component == 'lib'
        run: python3 -m unittest discover -s tools/port-rust-span-lib -p 'test_*.py'
      - name: Compare portable Lib and serializer observations
        if: matrix.component == 'lib'
        run: |
          for stem in source format display generic generic_ambient session_inputs flags_iter flags_format memory map opaque_callbacks owned_hash boxes pos; do
            python3 "tools/port-rust-span-lib/generate_${stem}.py" --check
          done
          for stem in file trait_defaults trait_failures tracing_profile byte_slice_strategy macro_backtrace_context span_geometry span_hygiene; do
            python3 "tools/port-rust-span-lib/generate_${stem}.py" --check
          done
      - name: Produce verbatim Lib panic and consuming callback evidence
        if: matrix.component == 'lib'
        run: |
          producer="$RUNNER_TEMP/span-lib-producers"
          python3 tools/port-rust-span-lib/generate_panic.py --output-dir "$producer/panic"
          python3 tools/port-rust-span-lib/generate_remaining_context.py --output-dir "$producer/remaining"
          python3 tools/port-rust-span-lib/generate_consuming_callbacks.py --output-dir "$producer/consuming"
      - name: Replay Lib and codec evidence with the selected producer bundles
        if: matrix.component == 'lib'
        run: |
          go test -p 1 -count=1 -timeout 30m ./port/rust/compiler/rustc_span/src -run '^TestLibUpstream(LookupLine|NormalizeNewlines|Trim|UnnormalizedSourceLength)$'
          selection='^(TestLib|TestOriginalSpanGeometry$|TestOriginalSpanHygieneWrappers$|TestOriginalMacroBacktraceContext$|TestOriginalConsumingCallbacks$|TestConsumingProducerSelector$|TestOriginalMemory|TestOriginalFileEncoder|TestOriginalDeterministicMap|TestOriginalOpaque)'
          go test -p 1 -count=1 -timeout 30m ./port/rust/compiler/rustc_span/src ./port/rust/compiler/rustc_serialize/src -run "$selection"
          go test -p 1 -race -count=1 -timeout 30m ./port/rust/compiler/rustc_span/src ./port/rust/compiler/rustc_serialize/src -run "$selection"
          go test -p 1 -count=1 -timeout 30m -tags 'ferrugo_rustc_nightly rustc_stable_hash_nightly' ./port/rust/compiler/rustc_span/src ./port/rust/compiler/rustc_serialize/src -run "$selection"
          go vet -p 1 -tags 'ferrugo_rustc_nightly rustc_stable_hash_nightly' ./port/rust/compiler/rustc_span/src ./port/rust/compiler/rustc_serialize/src
        env:
          FERRUGO_LIB_PANIC_PROOF: ${{ runner.temp }}/span-lib-producers/panic
          FERRUGO_LIB_REMAINING_PROOF: ${{ runner.temp }}/span-lib-producers/remaining
          FERRUGO_SPAN_CONSUMING_PROOF: ${{ runner.temp }}/span-lib-producers/consuming
      - name: Verify identity and hygiene proof integrity
        if: matrix.component == 'identity'
        run: |
          python3 -m unittest discover -s tools/port-rust-symbol -p 'test_*.py'
          python3 -m unittest discover -s tools/port-rust-symbol/panic -p 'test_*.py'
          python3 -m unittest discover -s tools/port-rust-hygiene -p 'test_*.py'
          python3 -m unittest discover -s tools/port-rust-def-id/reference-build -p 'test_*.py'
      - name: Compare scoped DefID dependencies with their accepted stable profile
        if: matrix.component == 'identity'
        run: |
          python3 tools/port-rust-def-id/reference-build/prepare.py --fetch
          python3 tools/port-rust-def-id/generate.py --offline --check
          python3 tools/port-rust-def-id/panic_metadata.py --offline --check
          python3 tools/port-rust-def-id/indexmap-alias/generate.py --offline --check
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
      - name: Compare Symbol and edit-distance source and derived APIs
        if: matrix.component == 'identity'
        run: |
          python3 tools/port-rust-symbol/generate_predefined.py --check
          python3 tools/port-rust-symbol/verify_predefined.py --offline --check
          python3 tools/port-rust-symbol/test_original_macros.py --offline --check
          python3 tools/port-rust-symbol/generate_edit_distance.py --offline --check
          python3 tools/port-rust-symbol/generate_unicode18.py --offline --check
          python3 tools/port-rust-symbol/generate.py --offline --check
          python3 tools/port-rust-symbol/generate_borrow_contract.py --check
          python3 tools/port-rust-symbol/audit.py --check
          python3 tools/port-rust-def-id/interval_type.py --offline --check
      - name: Compare complete hygiene operations and non-Copy commit cleanup
        if: matrix.component == 'identity'
        run: |
          python3 tools/port-rust-hygiene/generate.py --check
          python3 tools/port-rust-hygiene/commit_generate.py --check
          python3 tools/port-rust-hygiene/source_inventory.py --check
      - name: Produce verbatim Symbol and hygiene owned panic evidence
        if: matrix.component == 'identity'
        run: |
          producer="$RUNNER_TEMP/span-identity-producers"
          python3 tools/port-rust-symbol/panic/generate.py --offline --jobs 1 --output-dir "$producer/symbol"
          python3 tools/port-rust-hygiene/owned_generate.py --output-dir "$producer/hygiene"
      - name: Replay identity and hygiene evidence with selected producer bundles
        if: matrix.component == 'identity'
        run: |
          selection='^(TestSymbol|TestIdent|TestDefId|TestOriginalHygiene|TestHygiene)'
          go test -p 1 -count=1 -timeout 30m ./port/rust/compiler/rustc_span/src -run "$selection"
          go test -p 1 -race -count=1 -timeout 30m ./port/rust/compiler/rustc_span/src -run "$selection"
          go test -p 1 -count=1 -timeout 30m ./port/rust/compiler/rustc_span/src/symbol ./port/rust/compiler/rustc_span/src/edit_distance
          go test -p 1 -race -count=1 -timeout 30m ./port/rust/compiler/rustc_span/src/symbol ./port/rust/compiler/rustc_span/src/edit_distance
          go test -p 1 -count=1 -timeout 30m -tags 'ferrugo_rustc_nightly rustc_stable_hash_nightly' ./port/rust/compiler/rustc_span/src -run "$selection"
          go vet -p 1 -tags 'ferrugo_rustc_nightly rustc_stable_hash_nightly' ./port/rust/compiler/rustc_span/src/...
        env:
          FERRUGO_SYMBOL_PANIC_PROFILE_DIR: ${{ runner.temp }}/span-identity-producers/symbol
          FERRUGO_HYGIENE_OWNED_PROFILE_DIR: ${{ runner.temp }}/span-identity-producers/hygiene
      - name: Verify SourceMap and caching reference selection
        if: matrix.component == 'source-map'
        run: |
          python3 tools/port-rust-str/prepare.py --fetch
          python3 -m unittest discover -s tools/port-rust-caching-source-map-view -p 'test_*.py'
          python3 -m unittest discover -s tools/port-rust-source-map -p 'test_*.py'
      - name: Compare complete SourceMap algorithms, callbacks and runtime scopes
        if: matrix.component == 'source-map'
        run: |
          python3 tools/port-rust-source-map/generate.py --all-profiles --check
          for stem in format format_locked owned owned_extract owned_into predicate_borrow owned_tracing tracing span_wrappers get_map path io sparse_file binary_layout stderr; do
            python3 "tools/port-rust-source-map/generate_${stem}.py" --check
          done
          python3 tools/port-rust-source-map/generate_owned.py --format-error --check
          python3 tools/port-rust-source-map/generate_owned_extract.py --predicates --check
          python3 tools/port-rust-source-map/generate_tracing.py --verbatim --check
          python3 tools/port-rust-source-map/generate_panic_sites.py --check
          python3 tools/port-rust-source-map/generate_panic_sites.py --max-domain --check
          python3 tools/port-rust-source-map/generate_panic_sites.py --width-metadata --check
          python3 tools/port-rust-source-map/consuming/generate.py --check
      - name: Produce verbatim SourceMap scoped-session and assertion evidence
        if: matrix.component == 'source-map'
        run: |
          producer="$RUNNER_TEMP/span-source-map-producers"
          python3 tools/port-rust-source-map/generate_panic_sites.py --session-map --output-dir "$producer"
          python3 tools/port-rust-source-map/generate_panic_sites.py --assert-id --output-dir "$producer"
      - name: Compare analyzer, Fatal and caching source-map operations
        if: matrix.component == 'source-map'
        run: |
          python3 tools/port-rust-analyze-source-file/generate.py --check
          python3 tools/port-rust-analyze-source-file/generate_panic.py --check
          python3 tools/port-rust-fatal-error/generate.py --check
          python3 tools/port-rust-caching-source-map-view/generate.py --check
          python3 tools/port-rust-caching-source-map-view/generate.py --metadata --check
          python3 tools/port-rust-caching-source-map-view/generate_context.py --check
          python3 tools/port-rust-caching-source-map-view/panic-sites/generate.py --check
      - name: Replay SourceMap, analyzer, Fatal and caching evidence
        if: matrix.component == 'source-map'
        run: |
          selection='^(TestSourceMap|TestAnalyze|TestOriginalAnalyze|TestFatalError|TestOriginalCachingSourceMap|TestCachingSourceMap)'
          go test -p 1 -count=1 -timeout 30m ./port/rust/compiler/rustc_span/src ./port/rust/compiler/rustc_span/src/source_map ./port/rust/compiler/rustc_span/src/analyze_source_file -run "$selection"
          go test -p 1 -race -count=1 -timeout 30m ./port/rust/compiler/rustc_span/src ./port/rust/compiler/rustc_span/src/source_map ./port/rust/compiler/rustc_span/src/analyze_source_file -run "$selection"
          go test -p 1 -count=1 -timeout 30m -tags 'ferrugo_rustc_nightly rustc_stable_hash_nightly' ./port/rust/compiler/rustc_span/src -run "$selection"
          go vet -p 1 -tags 'ferrugo_rustc_nightly rustc_stable_hash_nightly' ./port/rust/compiler/rustc_span/src/...
        env:
          FERRUGO_SOURCE_MAP_PANIC_PROOF: ${{ runner.temp }}/span-source-map-producers
      - name: Verify explicit no-cgo I/O and stdio bindings
        if: matrix.component == 'source-map'
        run: |
          go test -p 1 -count=1 ./port/rust/compiler/rustc_span/src -run '^TestSourceMapRealLoader(ExplicitUnixBindingIsLazyAndCurrent|OversizedSparseFileNativeOracle)$'
          go test -p 1 -count=1 ./port/support/rusterrno ./port/support/ruststdio
        env:
          CGO_ENABLED: '0'
      - name: Retain verbatim component producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: span-${{ matrix.component }}-native-producers
          path: ${{ runner.temp }}/span-${{ matrix.component }}-producers
          if-no-files-found: error
          retention-days: 14
